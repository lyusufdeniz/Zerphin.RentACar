<div class="customer-select">

  <div class="search-section">
    <div class="search-input-wrapper">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (keyup.enter)="search()"
        [placeholder]="translations().searchPlaceholder"
        class="search-input"
      />
      <button class="btn-primary search-btn" (click)="search()" type="button">
        {{ translations().searchButton }}
      </button>
      <button
        class="btn-secondary clear-btn"
        (click)="clearSearch()"
        type="button"
        *ngIf="searchQuery"
      >
        {{ translations().clearButton }}
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <div class="loading-spinner"></div>
    <p>{{ translations().loading }}</p>
  </div>

  <div *ngIf="!isLoading" class="customers-list">
    <div
      *ngFor="let customer of customers"
      class="customer-item"
      (click)="selectCustomer(customer)"
    >
      <div class="customer-info">
        <div class="customer-name">{{ getCustomerDisplayName(customer) }}</div>
        <div class="customer-details">{{ getCustomerDetailsText(customer) }}</div>
      </div>
      <div class="customer-id">
        <small>{{ customer.id }}</small>
      </div>
    </div>

    <div *ngIf="customers.length === 0" class="empty-state">
      <p>{{ translations().notFound }}</p>
    </div>
  </div>

  <div *ngIf="totalPages > 1 && !isLoading" class="pagination">
    <button
      class="pagination-btn"
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)"
    >
      {{ translations().previous }}
    </button>
    <span class="pagination-info">
      {{ translations().pageInfo }}
    </span>
    <button
      class="pagination-btn"
      [disabled]="currentPage === totalPages"
      (click)="changePage(currentPage + 1)"
    >
      {{ translations().next }}
    </button>
  </div>
</div>
