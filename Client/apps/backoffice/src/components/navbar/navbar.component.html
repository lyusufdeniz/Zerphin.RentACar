<header class="navbar">
  <div class="navbar-content">
    <div class="navbar-left">
      <button class="menu-toggle-btn" type="button" (click)="onMenuToggle()">
        <svg
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          class="menu-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <h1 class="page-title">Dashboard</h1>
    </div>
    <div class="navbar-right">
      <div class="clock">
        <svg
          class="clock-icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <span class="time">{{ currentTime }}</span>
        <span class="date">{{ currentDate }}</span>
      </div>
      <div class="user-card">
        <div class="user-avatar">
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            class="avatar-icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
        <div class="user-info">
          <span class="user-name">{{ user?.firstName }} {{ user?.lastName }}</span>
          <span class="user-role">{{ getRoleDisplayName() }}</span>
        </div>
        <button class="dropdown-btn" type="button" (click)="onLogout()" title="Çıkış Yap">
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            class="dropdown-icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
