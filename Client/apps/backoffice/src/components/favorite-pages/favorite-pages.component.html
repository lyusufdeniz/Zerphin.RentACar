<div class="favorite-pages-container">
  <div class="favorite-pages-header">
    <h3>
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
        />
      </svg>
      Favori Sayfalar
    </h3>
    <span class="count" *ngIf="favoritePages.length > 0">
      {{ favoritePages.length }}
    </span>
  </div>

  <div class="favorite-pages-list" *ngIf="favoritePages.length > 0">
    <div
      class="favorite-item"
      *ngFor="let page of favoritePages"
      [routerLink]="[page.path]"
      routerLinkActive="active"
      (click)="navigateTo(page.path)"
    >
      <svg
        class="favorite-icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="getIconSVGPath(page)"
        />
      </svg>
      <span class="favorite-title">{{ page.title }}</span>
      <button
        class="remove-btn"
        (click)="removeFavorite(page.path, $event)"
        title="Favorilerden Kaldır"
      >
        <svg
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          class="remove-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <div class="favorite-pages-empty" *ngIf="favoritePages.length === 0">
    <p>Henüz favori sayfa eklenmemiş</p>
    <span class="hint">Sayfaların üzerindeki yıldız butonuna tıklayarak favorilere ekleyebilirsiniz</span>
  </div>
</div>
