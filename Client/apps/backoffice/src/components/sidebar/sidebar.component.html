<aside class="sidebar" [class.sidebar-closed]="!isOpen">
  <div class="sidebar-header">
    <div class="logo-container">
      <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="sidebar-title sidebar-desc">
        <title id="sidebar-title">Rent&Go - Araç Kiralama Logo</title>
        <desc id="sidebar-desc">Neon yeşil ve siyah renklerde, lokasyon pini ve anahtar simgesi içeren modern logo</desc>
        <style>
          .bg { fill: transparent; }
          .pin { fill: var(--accent-color); }
          .key { fill: var(--accent-color); }
          .text { fill: var(--text-primary); font-family: "Inter", "Segoe UI", Roboto, sans-serif; font-weight:700; }
          .subl { fill: #cfcfcf; font-size:20px; font-weight:500; }
        </style>
        <g transform="translate(40,20)">
          <path class="pin" d="M90 10 C56 10 30 37 30 72 C30 118 90 170 90 170 C90 170 150 118 150 72 C150 37 124 10 90 10 Z"/>
          <circle cx="90" cy="72" r="28" fill="rgba(0,0,0,0.25)"/>
          <g transform="translate(120,120) rotate(-20)">
            <rect class="key" x="0" y="0" width="48" height="12" rx="3"/>
            <circle cx="6" cy="6" r="5" fill="var(--bg-primary)"/>
            <rect x="36" y="3" width="6" height="6" rx="1" fill="var(--bg-primary)"/>
          </g>
        </g>
        <g transform="translate(220,90)">
          <text class="text" x="0" y="0" font-size="48">RENT&amp;GO</text>
          <text class="subl" x="0" y="36">Araç Kiralama • Rent a Car</text>
        </g>
      </svg>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a
      routerLink="dashboard"
      routerLinkActive="active"
      class="nav-item"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg
        class="nav-icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        />
      </svg>
      <span>{{ translations().dashboard }}</span>
    </a>
    <a
      routerLink="cars"
      routerLinkActive="active"
      class="nav-item"
      [routerLinkActiveOptions]="{ exact: true }"
