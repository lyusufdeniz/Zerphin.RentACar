<div class="customer-select">
  <div class="search-section">
    <div class="search-input-wrapper">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (keyup.enter)="search()"
        placeholder="Marka, model veya plaka ile ara..."
        class="search-input"
      />
      <button class="btn-primary search-btn" (click)="search()" type="button" [disabled]="isLoading">
        Ara
      </button>
      <button
        *ngIf="searchQuery"
        class="btn-secondary clear-btn"
        (click)="clearSearch()"
        type="button"
      >
        Temizle
      </button>
    </div>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <div class="loading-spinner"></div>
    <p>Araçlar yükleniyor...</p>
  </div>

  <div class="customers-list" *ngIf="!isLoading">
    <div
      *ngFor="let vehicle of vehicles"
      class="customer-item"
      (click)="selectVehicle(vehicle)"
    >
      <div class="customer-avatar" *ngIf="getVehicleImage(vehicle)">
        <img [src]="getVehicleImage(vehicle)" [alt]="getVehicleDisplayName(vehicle)" />
      </div>
      <div class="customer-avatar-placeholder" *ngIf="!getVehicleImage(vehicle)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"
          />
        </svg>
      </div>
      <div class="customer-info">
        <div class="customer-name">{{ getVehicleDisplayName(vehicle) }}</div>
        <div class="customer-details">{{ getVehicleDetailsText(vehicle) }}</div>
      </div>
      <div class="customer-id">
        <small>{{ vehicle.id }}</small>
      </div>
    </div>

    <div *ngIf="vehicles.length === 0" class="empty-state">
      <p>Araç bulunamadı</p>
    </div>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button
      class="btn-pagination"
      (click)="changePage(currentPage - 1)"
      [disabled]="currentPage === 1"
    >
      Önceki
    </button>
    <span class="pagination-info">
      Sayfa {{ currentPage }} / {{ totalPages }} (Toplam: {{ totalCount }})
    </span>
    <button
      class="btn-pagination"
      (click)="changePage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
    >
      Sonraki
    </button>
  </div>
</div>
