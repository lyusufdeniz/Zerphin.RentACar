<form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="vehicle-form">
  <div class="form-grid">
    <!-- Brand -->
    <div class="form-group">
      <label for="brand" class="form-label">Marka <span class="required">*</span></label>
      <input
        id="brand"
        type="text"
        formControlName="brand"
        class="form-input"
        [class.error]="hasError('brand', 'required')"
        placeholder="Marka girin"
      />
      <div class="error-message" *ngIf="hasError('brand', 'required')">
        {{ getErrorMessage('brand') }}
      </div>
    </div>

    <!-- Model -->
    <div class="form-group">
      <label for="model" class="form-label">Model <span class="required">*</span></label>
      <input
        id="model"
        type="text"
        formControlName="model"
        class="form-input"
        [class.error]="hasError('model', 'required')"
        placeholder="Model girin"
      />
      <div class="error-message" *ngIf="hasError('model', 'required')">
        {{ getErrorMessage('model') }}
      </div>
    </div>

    <!-- License Plate -->
    <div class="form-group">
      <label for="licensePlate" class="form-label">Plaka <span class="required">*</span></label>
      <input
        id="licensePlate"
        type="text"
        formControlName="licensePlate"
        class="form-input"
        [class.error]="hasError('licensePlate', 'required')"
        placeholder="34ABC123"
      />
      <div class="error-message" *ngIf="hasError('licensePlate', 'required')">
        {{ getErrorMessage('licensePlate') }}
      </div>
    </div>

    <!-- Year -->
    <div class="form-group">
      <label for="year" class="form-label">Yıl <span class="required">*</span></label>
      <input
        id="year"
        type="number"
        formControlName="year"
        class="form-input"
        [class.error]="hasError('year', 'required') || hasError('year', 'min') || hasError('year', 'max')"
        placeholder="2024"
      />
      <div class="error-message" *ngIf="hasError('year', 'required') || hasError('year', 'min') || hasError('year', 'max')">
        {{ getErrorMessage('year') }}
      </div>
    </div>

    <!-- Color -->
    <div class="form-group">
      <label for="color" class="form-label">Renk</label>
      <input
        id="color"
        type="text"
        formControlName="color"
        class="form-input"
        placeholder="Beyaz"
      />
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="category" class="form-label">Kategori <span class="required">*</span></label>
      <select id="category" formControlName="category" class="form-input">
        <option *ngFor="let cat of categories" [ngValue]="cat">
          {{ categoryNames[cat] }}
        </option>
      </select>
    </div>


    <!-- Daily Rental Price -->
    <div class="form-group">
      <label for="dailyRentalPrice" class="form-label">Günlük Kira Fiyatı (TL) <span class="required">*</span></label>
      <input
        id="dailyRentalPrice"
        type="number"
        formControlName="dailyRentalPrice"
        class="form-input"
        [class.error]="hasError('dailyRentalPrice', 'required') || hasError('dailyRentalPrice', 'min')"
        placeholder="0.00"
        step="0.01"
        min="0"
      />
      <div class="error-message" *ngIf="hasError('dailyRentalPrice', 'required') || hasError('dailyRentalPrice', 'min')">
        {{ getErrorMessage('dailyRentalPrice') }}
      </div>
    </div>

    <!-- Seating Capacity -->
    <div class="form-group">
      <label for="seatingCapacity" class="form-label">Koltuk Sayısı <span class="required">*</span></label>
      <input
        id="seatingCapacity"
        type="number"
        formControlName="seatingCapacity"
        class="form-input"
        [class.error]="hasError('seatingCapacity', 'required') || hasError('seatingCapacity', 'min')"
        placeholder="5"
        min="1"
        max="50"
      />
      <div class="error-message" *ngIf="hasError('seatingCapacity', 'required') || hasError('seatingCapacity', 'min')">
        {{ getErrorMessage('seatingCapacity') }}
      </div>
    </div>

    <!-- Fuel Type -->
    <div class="form-group">
      <label for="fuelType" class="form-label">Yakıt Türü</label>
      <select id="fuelType" formControlName="fuelType" class="form-input">
        <option value="">Seçiniz</option>
        <option *ngFor="let fuel of fuelTypes" [value]="fuel">
          {{ fuel }}
        </option>
      </select>
    </div>

    <!-- Transmission -->
    <div class="form-group">
      <label for="transmission" class="form-label">Vites Türü</label>
      <select id="transmission" formControlName="transmission" class="form-input">
        <option value="">Seçiniz</option>
        <option *ngFor="let trans of transmissionTypes" [value]="trans">
          {{ trans }}
        </option>
      </select>
    </div>

    <!-- KM -->
    <div class="form-group">
      <label for="km" class="form-label">Kilometre</label>
      <input
        id="km"
        type="number"
        formControlName="km"
        class="form-input"
        [class.error]="hasError('km', 'min')"
        placeholder="0"
        min="0"
      />
      <div class="error-message" *ngIf="hasError('km', 'min')">
        {{ getErrorMessage('km') }}
      </div>
    </div>

    <!-- Image -->
    <div class="form-group full-width">
      <label for="image" class="form-label">Araç Görseli</label>
      <input
        id="image"
        type="file"
        accept="image/*"
        (change)="onFileChange($event)"
        class="form-input"
      />
      <div *ngIf="getImagePreview()" class="image-preview">
        <img [src]="getImagePreview()" alt="Preview" />
      </div>
    </div>

    <!-- Description -->
    <div class="form-group full-width">
      <label for="description" class="form-label">Açıklama</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-input"
        rows="4"
        placeholder="Araç açıklaması..."
      ></textarea>
    </div>

    <!-- Features -->
    <div class="form-group full-width">
      <label class="form-label">Özellikler</label>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasAirConditioning" />
          <span>Klima</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasGPS" />
          <span>GPS</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasBluetooth" />
          <span>Bluetooth</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Form Footer -->
  <div modal-footer class="form-footer">
    <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="isLoading">
      İptal
    </button>
    <button type="submit" class="btn-primary" [disabled]="isLoading">
      <span *ngIf="isLoading">Kaydediliyor...</span>
      <span *ngIf="!isLoading">{{ isEditMode ? 'Güncelle' : 'Kaydet' }}</span>
    </button>
  </div>
</form>
