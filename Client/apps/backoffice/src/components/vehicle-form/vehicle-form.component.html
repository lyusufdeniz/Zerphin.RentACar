<form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="vehicle-form">
  <div class="form-grid">

    <div class="form-group">
      <label for="brand" class="form-label">{{ translations().brand }} <span class="required">*</span></label>
      <input
        id="brand"
        type="text"
        formControlName="brand"
        class="form-input"
        [class.error]="hasError('brand', 'required')"
        [placeholder]="translations().brandPlaceholder"
      />
      <div class="error-message" *ngIf="hasError('brand', 'required')">
        {{ getErrorMessage('brand') }}
      </div>
    </div>

    <div class="form-group">
      <label for="model" class="form-label">{{ translations().model }} <span class="required">*</span></label>
      <input
        id="model"
        type="text"
        formControlName="model"
        class="form-input"
        [class.error]="hasError('model', 'required')"
        [placeholder]="translations().modelPlaceholder"
      />
      <div class="error-message" *ngIf="hasError('model', 'required')">
        {{ getErrorMessage('model') }}
      </div>
    </div>

    <div class="form-group">
      <label for="licensePlate" class="form-label">{{ translations().licensePlate }} <span class="required">*</span></label>
      <input
        id="licensePlate"
        type="text"
        formControlName="licensePlate"
        class="form-input"
        [class.error]="hasError('licensePlate', 'required')"
        [placeholder]="translations().licensePlatePlaceholder"
      />
      <div class="error-message" *ngIf="hasError('licensePlate', 'required')">
        {{ getErrorMessage('licensePlate') }}
      </div>
    </div>

    <div class="form-group">
      <label for="year" class="form-label">{{ translations().year }} <span class="required">*</span></label>
      <input
        id="year"
        type="number"
        formControlName="year"
        class="form-input"
        [class.error]="hasError('year', 'required') || hasError('year', 'min') || hasError('year', 'max')"
        [placeholder]="translations().yearPlaceholder"
      />
      <div class="error-message" *ngIf="hasError('year', 'required') || hasError('year', 'min') || hasError('year', 'max')">
        {{ getErrorMessage('year') }}
      </div>
    </div>

    <div class="form-group">
      <label for="color" class="form-label">{{ translations().color }}</label>
      <input
        id="color"
        type="text"
        formControlName="color"
        class="form-input"
        [placeholder]="translations().colorPlaceholder"
      />
    </div>

    <div class="form-group">
      <label for="category" class="form-label">{{ translations().category }} <span class="required">*</span></label>
      <select id="category" formControlName="category" class="form-input">
        <option *ngFor="let cat of categories" [ngValue]="cat">
          {{ categoryNames[cat] }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="dailyRentalPrice" class="form-label">{{ translations().dailyRentalPrice }} <span class="required">*</span></label>
      <input
        id="dailyRentalPrice"
        type="number"
        formControlName="dailyRentalPrice"
        class="form-input"
        [class.error]="hasError('dailyRentalPrice', 'required') || hasError('dailyRentalPrice', 'min')"
        [placeholder]="translations().dailyRentalPricePlaceholder"
        step="0.01"
        min="0"
      />
      <div class="error-message" *ngIf="hasError('dailyRentalPrice', 'required') || hasError('dailyRentalPrice', 'min')">
        {{ getErrorMessage('dailyRentalPrice') }}
      </div>
    </div>

    <div class="form-group">
      <label for="seatingCapacity" class="form-label">{{ translations().seatingCapacity }} <span class="required">*</span></label>
      <input
        id="seatingCapacity"
        type="number"
        formControlName="seatingCapacity"
        class="form-input"
        [class.error]="hasError('seatingCapacity', 'required') || hasError('seatingCapacity', 'min')"
        [placeholder]="translations().seatingCapacityPlaceholder"
        min="1"
        max="50"
      />
      <div class="error-message" *ngIf="hasError('seatingCapacity', 'required') || hasError('seatingCapacity', 'min')">
        {{ getErrorMessage('seatingCapacity') }}
      </div>
    </div>

    <div class="form-group">
      <label for="fuelType" class="form-label">{{ translations().fuelType }}</label>
      <select id="fuelType" formControlName="fuelType" class="form-input">
        <option value="">{{ translations().select }}</option>
        <option *ngFor="let fuel of fuelTypes" [value]="fuel">
          {{ getFuelTypeLabel(fuel) }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="transmission" class="form-label">{{ translations().transmission }}</label>
      <select id="transmission" formControlName="transmission" class="form-input">
        <option value="">{{ translations().select }}</option>
        <option *ngFor="let trans of transmissionTypes" [value]="trans">
          {{ getTransmissionTypeLabel(trans) }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="km" class="form-label">{{ translations().km }}</label>
      <input
        id="km"
        type="number"
        formControlName="km"
        class="form-input"
        [class.error]="hasError('km', 'min')"
        [placeholder]="translations().kmPlaceholder"
        min="0"
      />
      <div class="error-message" *ngIf="hasError('km', 'min')">
        {{ getErrorMessage('km') }}
      </div>
    </div>

    <div class="form-group full-width">
      <label for="image" class="form-label">{{ translations().image }}</label>
      <input
        id="image"
        type="file"
        accept="image/*"
        (change)="onFileChange($event)"
        class="form-input"
      />
      <div *ngIf="getImagePreview()" class="image-preview">
        <img [src]="getImagePreview()" alt="Preview" />
      </div>
      <small class="hint-text">{{ translations().imageHint }}</small>
    </div>

    <div class="form-group full-width">
      <label for="description" class="form-label">{{ translations().description }}</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-input"
        rows="4"
        [placeholder]="translations().descriptionPlaceholder"
      ></textarea>
    </div>

    <div class="form-group full-width">
      <label class="form-label">{{ translations().features }}</label>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasAirConditioning" />
          <span>{{ translations().hasAirConditioning }}</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasGPS" />
          <span>{{ translations().hasGPS }}</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasBluetooth" />
          <span>{{ translations().bluetooth }}</span>
        </label>
      </div>
    </div>
  </div>

  <div modal-footer class="form-footer">
    <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="isLoading">
      {{ translations().cancel }}
    </button>
    <button type="submit" class="btn-primary" [disabled]="isLoading">
      <span *ngIf="isLoading">{{ translations().saving }}</span>
      <span *ngIf="!isLoading">{{ isEditMode ? translations().update : translations().save }}</span>
    </button>
  </div>
</form>
